# Production / local full-stack deployment
# Usage:
#   1. copy .env.deploy.example -> .env.deploy and set secrets
#   2. docker compose --env-file .env.deploy -f docker-compose.yml up -d --build
#   3. open http://localhost

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wafer_yield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wafer_yield}
      POSTGRES_DB: ${POSTGRES_DB:-wafer_yield}
    volumes:
      - wafer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wafer_yield} -d ${POSTGRES_DB:-wafer_yield}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - wafer_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wafer_yield}:${POSTGRES_PASSWORD:-wafer_yield}@postgres:5432/${POSTGRES_DB:-wafer_yield}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:3000}
      TELEMETRY_CHANNEL: ${TELEMETRY_CHANNEL:-test-floor.events}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.deploy}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STALE_TELEMETRY_SECONDS: ${STALE_TELEMETRY_SECONDS:-45}
      HOST: 0.0.0.0
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  wafer_pg:
  wafer_redis:
